<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 - Limitador de Peticiones</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 {
            color: #1e293b;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn-azul {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
            width: 100%;
            margin-bottom: 10px;
        }
        .btn-azul:hover {
            background-color: #1d4ed8;
        }
        .btn-azul:active {
            transform: scale(0.98);
        }
        .btn-reiniciar {
            background-color: transparent;
            color: #ef4444;
            border: 1px solid #fca5a5;
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }
        .btn-reiniciar:hover {
            background-color: #fef2f2;
        }
        .resultado-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            color: #0f172a;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ejercicio 3: Control de Intentos</h1>
        <p>Presiona repetidamente para ejecutar la acción de "Login" (Máximo 2 intentos permitidos).</p>
        
        <button class="btn-azul" id="btnEjecutar">Intentar Acceso</button>
        <button class="btn-reiniciar" id="btnReiniciar">Reiniciar Contador</button>
        
        <div class="resultado-box" id="resultadoVisual"></div>
    </div>

    <script src="ejercicio3.js"></script>
    <script>
        // Inicializamos la fábrica del script
        const ejecutarLogin = crearControladorIntentos(2, "Login");

        document.getElementById('btnEjecutar').addEventListener('click', () => {
            const respuesta = ejecutarLogin();
            const caja = document.getElementById('resultadoVisual');
            caja.innerText = respuesta;
            caja.style.display = 'block';
        });

        document.getElementById('btnReiniciar').addEventListener('click', () => {
            const respuesta = ejecutarLogin(true);
            const caja = document.getElementById('resultadoVisual');
            caja.innerText = respuesta;
            caja.style.display = 'block';
        });
    </script>
</body>
</html>
